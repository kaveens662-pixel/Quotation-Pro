name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release needs signing secrets)"
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # AGP 9.x needs JDK 17 or newer
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Installs the Android SDK and accepts licenses so Gradle can
      # auto-download compileSdk 36.1 and build-tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools", but the old
          # "tools" package no longer exists and makes this step fail
          packages: platform-tools

      # The project has no gradlew / gradle-wrapper.jar, so install the
      # exact Gradle version from gradle-wrapper.properties
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      # app/build.gradle.kts expects ${rootDir}/debug.keystore, which is
      # git-ignored, so generate it here
      - name: Create debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        run: gradle assembleDebug --stacktrace

      # ---- Release build (optional) ----
      # Needs 3 repository secrets: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD
      # The key alias inside the keystore must be "upload"
      - name: Decode release keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing" && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.BUILD_TYPE == 'release'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quotation-pro-${{ env.BUILD_TYPE }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
